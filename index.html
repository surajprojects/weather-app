<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <main id="rootWrapper">
        <!-- Container 1 -->
        <div id="container1">
            <!-- City Search Form -->
            <form id="searchForm">
                <input type="text" name="searchInput" id="searchInput" placeholder="Search for places...">
                <div id="searchFormBtns">
                    <!-- Search Button -->
                    <button type="submit" id="searchBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="25" height="25" fill="none"
                            stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                    </button>
                    <!-- Clear Search Button -->
                    <button type="button" id="searchClearBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="25" height="25"
                            viewBox="0 0 24 24">
                            <path
                                d="M12,2C6.47,2,2,6.47,2,12s4.47,10,10,10s10-4.47,10-10S17.53,2,12,2z M17,15.59L15.59,17L12,13.41L8.41,17L7,15.59 L10.59,12L7,8.41L8.41,7L12,10.59L15.59,7L17,8.41L13.41,12L17,15.59z">
                            </path>
                        </svg>
                    </button>
                </div>
            </form>
            <!-- Current Weather Icon -->
            <div id="currentWeatherIcon">
                <i id="currentWeatherIconData" class="wi wi-na currentWeatherIcon"></i>
            </div>
            <!-- Current Temperature -->
            <p id="currentTempCel"><span id="currentTempDataCel">12</span><sup class="currentTempDegree">&deg;C</sup>
            </p>
            <p id="currentTempFah" class="hideElement"><span id="currentTempDataFah">24</span><sup
                    class="currentTempDegree">&deg;F</sup>
            </p>
            <!-- Current Day & Time -->
            <p id="currentDayTime"><span id="currentDayData">Monday</span>,&nbsp;<span id="currentTimeData">12:00
                    PM</span></p>
            <!-- Current Weather Condition -->
            <p id="currentWeatherCondition">Mostly Cloudy</p>
            <!-- Location -->
            <div id="currentLocation">
                <svg xmlns="http://www.w3.org/2000/svg" id="locationIcon" width="18" height="18" fill="black"
                    viewBox="0 0 24 24">
                    <path
                        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5 14.5 7.62 14.5 9 13.38 11.5 12 11.5z" />
                </svg>
                <p id="currentWeatherLocation">India</p>
            </div>
        </div>
        <!-- Container 2 -->
        <div id="container2">
            <!-- Nav Wrapper -->
            <div id="navWrapper">
                <p id="navTitle">Today's Highlights</p>
                <ul id="tempDisplayStyle">
                    <li id="tempDisplayCel" class="tempDisplay tempDisplaySelected">&deg;C</li>
                    <li id="tempDisplayFah" class="tempDisplay ">&deg;F</li>
                </ul>
            </div>
            <!-- All Cards -->
            <div class="allCards">
                <!-- Humidity Card -->
                <div id="humidityCard" class="weatherInfoCard">
                    <p id="humidityTitle" class="cardTitle">Humidity</p>
                    <p class="cardBody"><span id="humidityData">12</span><span id="cardMetricDisplay">%</span></p>
                    <p id="humidityStatus" class="cardDescription">Normal</p>
                </div>
                <!-- Wind Speed Card -->
                <div id="windSpeedCard" class="weatherInfoCard">
                    <p id="windTitle" class="cardTitle">Wind Speed</p>
                    <p class="cardBody"><span id="windData">12</span>&nbsp;<span>km/h</span></p>
                    <p id="windStatus" class="cardDescription">Average</p>
                </div>
                <!-- Visibility Card -->
                <div id="visibilityCard" class="weatherInfoCard">
                    <p id="visibility" class="cardTitle">Visibility</p>
                    <p class="cardBody"><span id="visibilityData">5.2</span>&nbsp;<span>km</span></p>
                    <p id="visibilityStatus" class="cardDescription">Unhealthy</p>
                </div>
            </div>
            <!-- Forecast Wrapper -->
            <div>
                <p id="forecastTitle">Forecasts</p>
                <!-- All Forecast Cards -->
                <div id="forecastAllCards" class="allCards">
                    <!-- Card 1 -->
                    <div class="weatherInfoCard weatherInfoCardForecast">
                        <p class="cardTitle forecastCardTitle">1:00 PM</p>
                        <div class="forecastCardBody">
                            <i class="wi wi-na"></i>
                        </div>
                        <p class="cardDescription"><span class="forecastStatus">12&deg;C</span></p>
                    </div>
                    <!-- Card 2 -->
                    <div class="weatherInfoCard weatherInfoCardForecast">
                        <p class="cardTitle forecastCardTitle">1:00 PM</p>
                        <div class="forecastCardBody">
                            <i class="wi wi-na"></i>
                        </div>
                        <p class="cardDescription"><span class="forecastStatus">12&deg;C</span></p>
                    </div>
                    <!-- Card 3 -->
                    <div class="weatherInfoCard weatherInfoCardForecast">
                        <p class="cardTitle forecastCardTitle">1:00 PM</p>
                        <div class="forecastCardBody">
                            <i class="wi wi-na"></i>
                        </div>
                        <p class="cardDescription"><span class="forecastStatus">12&deg;C</span></p>
                    </div>
                    <!-- Card 4 -->
                    <div class="weatherInfoCard weatherInfoCardForecast">
                        <p class="cardTitle forecastCardTitle">1:00 PM</p>
                        <div class="forecastCardBody">
                            <i class="wi wi-na"></i>
                        </div>
                        <p class="cardDescription"><span class="forecastStatus">12&deg;C</span></p>
                    </div>
                    <!-- Card 5 -->
                    <div class="weatherInfoCard weatherInfoCardForecast">
                        <p class="cardTitle forecastCardTitle">1:00 PM</p>
                        <div class="forecastCardBody">
                            <i class="wi wi-na"></i>
                        </div>
                        <p class="cardDescription"><span class="forecastStatus">12&deg;C</span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="dateAndTime.js"></script>
    <script type="module" src="weatherIconMap.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
